# Production ingress: only nginx publishes 80/443 to the host. Kong and Next.js are
# reached via the Docker network (kong:8000, cortex-web:3000). Optional localhost-only
# port bindings let you curl the stack from the server without exposing APIs on the public NIC.

services:
  cortex-db:
    image: postgres:16
    container_name: cortex-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: cortex-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --unsafe-bypass-fsync
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr redpanda:9092
      - --default-log-level=warn
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    networks:
      - cortex-network
    privileged: true

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: cortex-clickhouse
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cortex}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  cortex-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-ingest
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PG_HOST=cortex-db
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE}
      - PG_PORT=${PG_PORT:-5432}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-redpanda:9092}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-cortex}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    depends_on:
      cortex-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8080/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cortex-network

  kong:
    image: kong:3.6
    container_name: cortex-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_LOG_LEVEL: info
      KONG_LOG_SECRET: ${KONG_LOG_SECRET}
      KONG_TEST_API_KEY: ${KONG_TEST_API_KEY}
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - '127.0.0.1:8000:8000'
      - '127.0.0.1:8001:8001'
    depends_on:
      cortex-ingest:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cortex-network

  cortex-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KONG_URL: ${NEXT_PUBLIC_KONG_URL:-https://cortex.yourdomain.com}
        NEXT_PUBLIC_KONG_API_KEY: ${KONG_TEST_API_KEY}
    container_name: cortex-web
    environment:
      - KONG_URL=http://kong:8000
      - KONG_API_KEY=${KONG_TEST_API_KEY}
      - NEXT_PUBLIC_KONG_URL=${NEXT_PUBLIC_KONG_URL:-https://cortex.yourdomain.com}
      - NEXT_PUBLIC_KONG_API_KEY=${KONG_TEST_API_KEY}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cortex-network

  nginx:
    image: nginx:alpine
    container_name: cortex-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      kong:
        condition: service_healthy
      cortex-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cortex-network

networks:
  cortex-network:
    driver: bridge
