events {
    worker_connections 1024;
}

http {
    upstream kong {
        server kong:8000;
    }

    upstream web {
        server cortex-web:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name cortex.nikhilbajaj.xyz;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name cortex.nikhilbajaj.xyz;

        ssl_certificate /etc/letsencrypt/live/cortex.nikhilbajaj.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cortex.nikhilbajaj.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API endpoints → Kong
        location /api/ {
            proxy_pass http://kong;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web UI → Next.js
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}






