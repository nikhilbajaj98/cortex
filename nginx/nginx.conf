events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — avoids stale upstream IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name cortex.nikhilbajaj.xyz;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name cortex.nikhilbajaj.xyz;

        ssl_certificate /etc/letsencrypt/live/cortex.nikhilbajaj.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cortex.nikhilbajaj.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API → Kong (variable proxy_pass so resolver above is used)
        location /api/ {
            set $kong_upstream http://kong:8000;
            proxy_pass $kong_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Web UI → Next.js (must listen on 0.0.0.0 inside the container)
        location / {
            set $web_upstream http://cortex-web:3000;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}






