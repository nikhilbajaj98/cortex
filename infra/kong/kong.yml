_format_version: "3.0"
_transform: true

services:
  - name: cortex-ingest-svc
    url: http://cortex-ingest:8080
    routes:
      - name: cortex-ingest-route
        paths:
          - "/api/v1/ingest"
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: key-auth
          - name: rate-limiting
            config:
              minute: 6000
              policy: local
          - name: correlation-id
            config:
              header_name: "X-Request-ID"
              generator: "uuid"
              echo_downstream: true
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Edge: kong"
                  - "X-Source: gateway"
          - name: http-log
            config:
              http_endpoint: "http://cortex-ingest:8080/api/v1/ingest/kong"
              method: "POST"
              timeout: 10000
              headers:
                X-Kong-Log-Secret: "changeme"
              queue:
                max_batch_size: 100
                max_coalescing_delay: 2
  - name: cortex-metrics-svc
    url: http://cortex-ingest:8080
    routes:
      - name: cortex-metrics-route
        paths:
          - "/api/v1/metrics"
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "OPTIONS"]
              headers: ["Accept", "Content-Type", "X-Request-ID", "apikey", "Authorization"]
              exposed_headers: ["X-Request-ID", "X-Kong-Request-Id"]
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: key-auth
            config:
              hide_credentials: false
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: correlation-id
            config:
              header_name: "X-Request-ID"
              generator: "uuid"
              echo_downstream: true
      - name: cortex-control-plane-route
        paths:
          - "/api/v1/control-plane"
        methods: ["GET", "POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Content-Type", "X-Request-ID", "apikey", "Authorization"]
              exposed_headers: ["X-Request-ID", "X-Kong-Request-Id"]
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: key-auth
            config:
              hide_credentials: false
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: correlation-id
            config:
              header_name: "X-Request-ID"
              generator: "uuid"
              echo_downstream: true
  - name: cortex-demo-svc
    url: http://cortex-ingest:8080
    routes:
      - name: cortex-demo-route
        paths:
          - "/api/v1/demo"
        methods: ["GET", "POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Content-Type", "X-Request-ID", "apikey", "Authorization"]
              exposed_headers: ["X-Request-ID", "X-Kong-Request-Id"]
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: key-auth
            config:
              hide_credentials: false
          - name: rate-limiting
            config:
              minute: 1800
              policy: local
          - name: correlation-id
            config:
              header_name: "X-Request-ID"
              generator: "uuid"
              echo_downstream: true

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "OPTIONS"]
      headers: ["Accept", "Content-Type", "X-Request-ID", "apikey", "Authorization"]
      exposed_headers: ["X-Request-ID", "X-Kong-Request-Id"]
      credentials: false
      max_age: 3600
      preflight_continue: false

consumers:
  - username: test-producer
    keyauth_credentials:
      - key: test-key


