_format_version: "3.0"
_transform: true

services:
  - name: cortex-ingest-svc
    url: http://cortex-ingest:8080
    routes:
      - name: cortex-ingest-route
        paths:
          - "/api/v1/ingest"
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: key-auth
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: correlation-id
            config:
              header_name: "X-Request-ID"
              generator: "uuid"
              echo_downstream: true
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Edge: kong"
                  - "X-Source: gateway"
          - name: http-log
            config:
              http_endpoint: "http://cortex-ingest:8080/api/v1/ingest/kong"
              method: "POST"
              timeout: 10000
              headers:
                X-Kong-Log-Secret: "changeme"
              queue:
                max_batch_size: 100
                max_coalescing_delay: 2

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "OPTIONS"]
      headers: ["Accept", "Content-Type", "X-Request-ID", "apikey"]
      credentials: false
      max_age: 3600

consumers:
  - username: test-producer
    keyauth_credentials:
      - key: test-key


